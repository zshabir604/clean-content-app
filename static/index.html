<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanContent .ai</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0c10;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 34px 34px;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    .wrapper {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 50px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #f59e0b;
    }

    .badge {
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #f59e0b;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.06);
    }

    /* Hero Text */
    .hero-title {
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 18px;
    }

    .hero-title .line-1 {
      display: block;
      color: #ffffff;
    }

    .hero-title .line-2 {
      display: block;
      color: #f59e0b;
    }

    .hero-desc {
      text-align: center;
      font-size: 16px;
      line-height: 1.6;
      color: #9ca3af;
      max-width: 520px;
      margin: 0 auto 40px;
    }

    /* Full-Size Upload Box */
    .upload-card {
      width: 100%;
      background: #12141a;
      border: 1px solid #222634;
      border-radius: 24px;
      padding: 44px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .icon-box {
      width: 68px;
      height: 68px;
      background: #f59e0b;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.45);
    }

    .card-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }

    .card-subtitle {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 28px;
      text-align: center;
    }

    .browse-link {
      color: #f59e0b;
      text-decoration: underline;
      cursor: pointer;
      font-weight: 500;
    }

    /* Option Toggle Buttons */
    .options-group {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 440px;
      margin-bottom: 20px;
    }

    .option-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      background: #171922;
      border: 1px solid #282d3d;
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn.active {
      background: #1f2330;
      border-color: #f59e0b;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.2);
    }

    /* Word Censor Section */
    #wordsSection {
      width: 100%;
      max-width: 440px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #wordsSection.hidden {
      display: none;
    }

    .words-label {
      font-size: 13px;
      color: #9ca3af;
    }

    .words-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: #0b0c10;
      border: 1px solid #282d3d;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .words-input:focus {
      border-color: #f59e0b;
    }

    /* Size Info */
    .size-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1b1e28;
      border: 1px solid #242836;
      color: #9ca3af;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-top: 6px;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Navbar Header -->
    <div class="top-bar">
      <div class="logo">CleanContent <span>.ai</span></div>
      <div class="badge">v1.1 Multi-Tool</div>
    </div>

    <!-- Main Title Lines -->
    <h1 class="hero-title">
      <span class="line-1">Smart Audio Suite.</span>
      <span class="line-2">Clean & Cut.</span>
    </h1>

    <!-- Centered Paragraph -->
    <p class="hero-desc">
      Remove awkward pauses with Silence Remover, or sanitize speech & sensitive words with Complete Silence.
    </p>

    <!-- Main Card Box -->
    <div class="upload-card">
      <div class="icon-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#0b0c10">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
      </div>

      <div class="card-title">Select or drop your audio clip</div>
      <div class="card-subtitle">
        MP3, WAV, M4A, MP4 supported. 
        <span class="browse-link" onclick="document.getElementById('fileInput').click()">Browse files</span>
      </div>

      <input type="file" id="fileInput" accept="audio/*,video/*" />

      <!-- Mode Toggle Buttons -->
      <div class="options-group">
        <button type="button" class="option-btn active" id="btnSilence" onclick="selectTool('silence')">
          ✂️ Silence Remover
        </button>
        <button type="button" class="option-btn" id="btnClean" onclick="selectTool('clean')">
          🔇 Clean Audio
        </button>
      </div>

      <!-- Censoring Words Input (Clean Audio Mode Only) -->
      <div id="wordsSection" class="hidden">
        <label class="words-label" for="badWordsInput">Add words to mute (separated by comma):</label>
        <input type="text" id="badWordsInput" class="words-input" placeholder="e.g. damn, shoot, pause" />
      </div>

      <div class="size-badge">
        ⏱️ Max 100 MB
      </div>
    </div>
  </div>

  <script>
    function selectTool(mode) {
      const btnSilence = document.getElementById('btnSilence');
      const btnClean = document.getElementById('btnClean');
      const wordsSection = document.getElementById('wordsSection');

      if (mode === 'silence') {
        btnSilence.classList.add('active');
        btnClean.classList.remove('active');
        wordsSection.classList.add('hidden');
      } else if (mode === 'clean') {
        btnClean.classList.add('active');
        btnSilence.classList.remove('active');
        wordsSection.classList.remove('hidden');
      }
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        document.querySelector('.card-title').innerText = e.target.files[0].name;
      }
    });
  </script>

</body>
</html>
