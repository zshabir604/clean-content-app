<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanContent .ai</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0c10;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 34px 34px;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 30px;
      overflow-x: hidden;
    }

    .wrapper {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #f59e0b;
    }

    .badge {
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #f59e0b;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.06);
    }

    /* Main Container Card */
    .main-card {
      width: 100%;
      background: #12141a;
      border: 1px solid #222634;
      border-radius: 24px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    /* Upload Zone */
    .upload-zone {
      width: 100%;
      background: #151821;
      border: 2px dashed #2f3547;
      border-radius: 18px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 20px;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: #f59e0b;
      background: #181d29;
      transform: translateY(-2px);
    }

    .icon-box {
      width: 82px;
      height: 82px;
      background: #f59e0b;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.5);
      transition: transform 0.25s ease;
      pointer-events: none;
    }

    .upload-zone:hover .icon-box {
      transform: scale(1.08);
    }

    .card-title {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
      pointer-events: none;
    }

    .card-subtitle {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      pointer-events: none;
    }

    .browse-link {
      color: #f59e0b;
      text-decoration: underline;
      font-weight: 600;
    }

    /* Active File Pill Box */
    .file-badge-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 10px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      width: 100%;
      animation: fadeInSlide 0.4s ease forwards;
    }

    .file-badge-box svg {
      color: #f59e0b;
      flex-shrink: 0;
    }

    .file-name-text {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Tools Options Switch */
    .options-group {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-bottom: 20px;
      transition: all 0.4s ease;
    }

    .option-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      background: #171922;
      border: 1px solid #282d3d;
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .option-btn:hover {
      border-color: rgba(245, 158, 11, 0.5);
      color: #fff;
    }

    .option-btn.active {
      background: #1f2330;
      border-color: #f59e0b;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.25);
      transform: translateY(-1px);
    }

    /* Clean Audio Config Dropdown */
    .clean-config-section {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid #222634;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: slideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .sub-section-title {
      font-size: 11px;
      color: #9ca3af;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .censor-modes-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .mode-sub-btn {
      flex: 1;
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid #282d3d;
      background: #0b0c10;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .mode-sub-btn.selected {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      color: #f59e0b;
    }

    .words-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      background: #0b0c10;
      border: 1px solid #282d3d;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .words-input:focus {
      border-color: #f59e0b;
    }

    /* Wave Equalizer Animation */
    .processing-wave-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 15px 0 20px;
      animation: fadeIn 0.3s ease;
    }

    .wave-bars {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 38px;
    }

    .wave-bar {
      width: 5px;
      height: 8px;
      background: #f59e0b;
      border-radius: 99px;
      animation: pulseWave 1s ease-in-out infinite alternate;
    }

    .wave-bar:nth-child(1) { animation-delay: 0.1s; }
    .wave-bar:nth-child(2) { animation-delay: 0.25s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
    .wave-bar:nth-child(4) { animation-delay: 0.2s; }
    .wave-bar:nth-child(5) { animation-delay: 0.5s; }
    .wave-bar:nth-child(6) { animation-delay: 0.3s; }

    @keyframes pulseWave {
      0% { height: 8px; opacity: 0.4; }
      100% { height: 36px; opacity: 1; box-shadow: 0 0 12px rgba(245, 158, 11, 0.6); }
    }

    /* Process Button */
    .process-btn {
      width: 100%;
      background: #f59e0b;
      color: #000000;
      border: none;
      font-size: 15px;
      font-weight: 700;
      padding: 15px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25);
    }

    .process-btn:hover {
      background: #d97706;
      box-shadow: 0 6px 24px rgba(245, 158, 11, 0.4);
    }

    .process-btn:active {
      transform: scale(0.99);
    }

    .process-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Result Stage Card */
    .result-box {
      width: 100%;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #222634;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    audio {
      width: 100%;
      margin-bottom: 16px;
      outline: none;
    }

    .download-link {
      width: 100%;
      background: #10b981;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 13px;
      border-radius: 12px;
      text-align: center;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.25);
      margin-bottom: 16px;
    }

    .download-link:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .secondary-clean-card {
      width: 100%;
      background: rgba(245, 158, 11, 0.04);
      border: 1px dashed rgba(245, 158, 11, 0.3);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .secondary-clean-card:hover {
      background: rgba(245, 158, 11, 0.08);
      border-color: #f59e0b;
    }

    .transcript-box {
      width: 100%;
      max-height: 140px;
      overflow-y: auto;
      background: #0b0c10;
      border: 1px solid #242836;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #d1d5db;
      text-align: left;
      margin-bottom: 14px;
    }

    .bad-word {
      color: #f59e0b;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 4px;
      border-radius: 4px;
    }

    .status-msg {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 10px;
      text-align: center;
      min-height: 18px;
    }

    .size-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1b1e28;
      border: 1px solid #242836;
      color: #9ca3af;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-top: 18px;
    }

    /* Footer */
    .footer {
      width: 100%;
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: #9ca3af;
    }

    .profile-card {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #12141a;
      border: 1px solid #222634;
      padding: 8px 18px;
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .profile-card:hover {
      border-color: #f59e0b;
      background: #181d29;
      transform: translateY(-2px);
    }

    .avatar-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #f59e0b;
    }

    .profile-name {
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
    }

    .profile-role {
      color: #f59e0b;
      font-size: 11px;
      font-weight: 500;
      margin-left: 2px;
    }

    /* Keyframes */
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInSlide {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Navbar Header -->
    <div class="top-bar">
      <div class="logo">CleanContent <span>.ai</span></div>
      <div class="badge">v1.1 Multi-Tool</div>
    </div>

    <!-- Main Card -->
    <div class="main-card">
      
      <!-- Native Hidden File Input -->
      <input type="file" id="fileInput" class="hidden" accept="*/*" />

      <!-- Upload Zone Drop Label -->
      <label for="fileInput" class="upload-zone" id="dropZone">
        <div class="icon-box">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="#0b0c10">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <div class="card-title" id="uploadTitle">Select or drop your audio clip</div>
        <div class="card-subtitle">
          MP3, WAV, M4A, AAC supported. <span class="browse-link">Browse files</span>
        </div>
      </label>

      <!-- Active File Loaded Badge -->
      <div class="file-badge-box hidden" id="fileBadgeBox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span class="file-name-text" id="fileNameDisplay">Audio selected</span>
      </div>

      <!-- Main Mode Selector Group -->
      <div class="options-group" id="mainToolsGroup">
        <button type="button" class="option-btn active" id="btnSilence" onclick="selectTool('silence')">
          ✂️ Silence Remover
        </button>
        <button type="button" class="option-btn" id="btnClean" onclick="selectTool('clean')">
          🔇 Clean Audio
        </button>
      </div>

      <!-- Clean Audio Specific Sub-Settings -->
      <div id="cleanConfigSection" class="clean-config-section hidden">
        <div>
          <div class="sub-section-title" style="margin-bottom: 8px;">CENSORSHIP METHOD:</div>
          <div class="censor-modes-group">
            <button type="button" class="mode-sub-btn selected" data-censor="silence" onclick="setCensorMode('silence')">
              🔇 Mute Silence
            </button>
            <button type="button" class="mode-sub-btn" data-censor="beep" onclick="setCensorMode('beep')">
              🔊 Beep Tone
            </button>
            <button type="button" class="mode-sub-btn" data-censor="remove" onclick="setCensorMode('remove')">
              ✂️ Cut Word
            </button>
          </div>
        </div>

        <div>
          <div class="sub-section-title" style="margin-bottom: 6px;">ADD CUSTOM WORDS TO MUTE (OPTIONAL):</div>
          <input type="text" id="badWordsInput" class="words-input" placeholder="e.g. damn, shoot, bakwas (comma-separated)" />
        </div>
      </div>

      <!-- Processing Audio Waves Animation -->
      <div class="processing-wave-box hidden" id="waveAnimation">
        <div class="wave-bars">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <span style="font-size: 12px; color: #f59e0b; font-weight: 600;">AI Engine Processing...</span>
      </div>

      <!-- Action Button -->
      <button type="button" class="process-btn" id="processBtn" onclick="startProcessing()">
        ⚡ Process Audio
      </button>

      <div class="status-msg" id="statusMsg"></div>

      <!-- Result Section (Player -> Download -> Clean Option) -->
      <div class="result-box hidden" id="resultBox">
        <audio id="audioPlayer" controls></audio>
        
        <div class="transcript-box hidden" id="transcriptBox"></div>

        <a id="downloadLink" class="download-link" download="processed_audio.mp3">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download Processed Audio
        </a>

        <!-- Follow-up prompt to clean words on the trimmed file -->
        <div class="secondary-clean-card hidden" id="followUpCleanTab" onclick="switchToCensorAfterSilence()">
          <div style="font-size: 13px; font-weight: 700; color: #f59e0b;">🔇 Want to censor words in this trimmed audio?</div>
          <div style="font-size: 11px; color: #9ca3af; margin-top: 3px;">Click to open censorship options for this file</div>
        </div>
      </div>

      <div class="size-badge">
        ⏱️ Max 100 MB
      </div>
    </div>

    <!-- Single Profile Footer (Zain Shabir) -->
    <footer class="footer">
      <span>Engineered by</span>
      <a href="https://www.linkedin.com/in/zain-shabir-38a345322" target="_blank" rel="noopener noreferrer" class="profile-card">
        <img 
          src="/static/zain.jpg" 
          alt="Zain Shabir" 
          class="avatar-img" 
          onerror="this.src='https://ui-avatars.com/api/?name=Zain+Shabir&background=f59e0b&color=000'" 
        />
        <div>
          <span class="profile-name">Zain Shabir</span>
          <span class="profile-role">(Developer)</span>
        </div>
      </a>
    </footer>
  </div>

  <script>
    let currentMode = 'silence';
    let chosenCensorMode = 'silence';
    let currentJobId = null;

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileBadgeBox = document.getElementById('fileBadgeBox');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const statusMsg = document.getElementById('statusMsg');
    const processBtn = document.getElementById('processBtn');
    const waveAnimation = document.getElementById('waveAnimation');
    const resultBox = document.getElementById('resultBox');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');
    const transcriptBox = document.getElementById('transcriptBox');
    const cleanConfigSection = document.getElementById('cleanConfigSection');
    const followUpCleanTab = document.getElementById('followUpCleanTab');
    const btnSilence = document.getElementById('btnSilence');
    const btnClean = document.getElementById('btnClean');

    function selectTool(mode) {
      currentMode = mode;
      if (mode === 'silence') {
        btnSilence.classList.add('active');
        btnClean.classList.remove('active');
        cleanConfigSection.classList.add('hidden');
      } else if (mode === 'clean') {
        btnClean.classList.add('active');
        btnSilence.classList.remove('active');
        cleanConfigSection.classList.remove('hidden');
      }
    }

    function setCensorMode(mode) {
      chosenCensorMode = mode;
      document.querySelectorAll('.mode-sub-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.censor === mode);
      });
    }

    function handleSelectedFile(file) {
      currentJobId = null;
      fileNameDisplay.textContent = file.name;
      fileBadgeBox.classList.remove('hidden');
      resultBox.classList.add('hidden');
      statusMsg.innerText = "";
    }

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleSelectedFile(e.target.files[0]);
      }
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        handleSelectedFile(e.dataTransfer.files[0]);
      }
    });

    function switchToCensorAfterSilence() {
      selectTool('clean');
      cleanConfigSection.scrollIntoView({ behavior: 'smooth' });
    }

    async function startProcessing() {
      if (!currentJobId && (!fileInput.files || !fileInput.files.length)) {
        alert('Please select an audio/video file first!');
        return;
      }

      const formData = new FormData();
      if (currentJobId) {
        formData.append("job_id_existing", currentJobId);
      } else {
        formData.append("file", fileInput.files[0]);
      }

      processBtn.disabled = true;
      waveAnimation.classList.remove("hidden");
      resultBox.classList.add("hidden");
      transcriptBox.classList.add("hidden");
      statusMsg.innerText = "";

      let endpoint = "";
      if (currentMode === 'silence') {
        endpoint = "/api/remove-silence";
        statusMsg.innerText = "Trimming silent dead-air pauses...";
      } else {
        endpoint = "/api/process";
        formData.append("mode", chosenCensorMode);
        formData.append("custom_words", document.getElementById("badWordsInput").value);
        statusMsg.innerText = "Transcribing & censoring target words...";
      }

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          body: formData
        });

        if (!response.ok) throw new Error(await response.text());

        const data = await response.json();
        currentJobId = data.job_id;

        audioPlayer.src = data.audio_url;
        downloadLink.href = data.audio_url;

        // Transcript display if clean mode was used
        if (data.transcript && data.censored_words) {
          transcriptBox.classList.remove("hidden");
          transcriptBox.innerHTML = data.transcript.map(w => {
            const ms = Math.round(w.start * 1000);
            const isBad = data.censored_words.some(cw => Math.abs(cw.start - ms) < 150);
            return isBad ? `<span class="bad-word">[${chosenCensorMode.toUpperCase()}: ${w.word}]</span>` : w.word;
          }).join(" ");
          followUpCleanTab.classList.add("hidden");
        } else {
          // If silence remover was used, show prompt to clean this same audio
          followUpCleanTab.classList.remove("hidden");
        }

        statusMsg.innerText = `Done in ${data.elapsed_seconds}s!`;
        resultBox.classList.remove("hidden");
      } catch (err) {
        statusMsg.innerText = "Error: " + err.message;
      } finally {
        waveAnimation.classList.add("hidden");
        processBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
