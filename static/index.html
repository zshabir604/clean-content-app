<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanContent .ai</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0c10;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 34px 34px;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 30px;
    }

    .wrapper {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #f59e0b;
    }

    .badge {
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #f59e0b;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.06);
    }

    /* Hero Text */
    .hero-title {
      text-align: center;
      font-size: 40px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .hero-title .line-1 {
      display: block;
      color: #ffffff;
    }

    .hero-title .line-2 {
      display: block;
      color: #f59e0b;
    }

    .hero-desc {
      text-align: center;
      font-size: 15px;
      line-height: 1.6;
      color: #9ca3af;
      max-width: 520px;
      margin: 0 auto 36px;
    }

    /* Main Container Card */
    .main-card {
      width: 100%;
      background: #12141a;
      border: 1px solid #222634;
      border-radius: 24px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    /* Upload Dropzone Label */
    .upload-zone {
      width: 100%;
      background: #151821;
      border: 2px dashed #2f3547;
      border-radius: 18px;
      padding: 46px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.25s ease;
      margin-bottom: 24px;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: #f59e0b;
      background: #181d29;
    }

    .icon-box {
      width: 86px;
      height: 86px;
      background: #f59e0b;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.5);
      transition: transform 0.2s ease;
      pointer-events: none;
    }

    .upload-zone:hover .icon-box {
      transform: scale(1.06);
    }

    .card-title {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
      pointer-events: none;
    }

    .card-subtitle {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      pointer-events: none;
    }

    .browse-link {
      color: #f59e0b;
      text-decoration: underline;
      font-weight: 600;
    }

    /* Mode Selector Buttons */
    .options-group {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-bottom: 20px;
    }

    .option-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      background: #171922;
      border: 1px solid #282d3d;
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn.active {
      background: #1f2330;
      border-color: #f59e0b;
      color: #ffffff;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.2);
    }

    /* Censored Words Tab */
    #wordsSection {
      width: 100%;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #wordsSection.hidden {
      display: none;
    }

    .words-label {
      font-size: 13px;
      color: #9ca3af;
    }

    .words-input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      background: #0b0c10;
      border: 1px solid #282d3d;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .words-input:focus {
      border-color: #f59e0b;
    }

    /* Process Button */
    .process-btn {
      width: 100%;
      background: #f59e0b;
      color: #000000;
      border: none;
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-bottom: 16px;
    }

    .process-btn:hover {
      background: #d97706;
    }

    .process-btn:active {
      transform: scale(0.99);
    }

    .process-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Result Section */
    .result-box {
      width: 100%;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #222634;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    audio {
      width: 100%;
      margin: 16px 0;
      border-radius: 8px;
    }

    .download-link {
      width: 100%;
      background: #10b981;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      transition: background 0.2s;
      margin-bottom: 10px;
    }

    .download-link:hover {
      background: #059669;
    }

    .transcript-box {
      width: 100%;
      max-height: 140px;
      overflow-y: auto;
      background: #0b0c10;
      border: 1px solid #242836;
      border-radius: 10px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #d1d5db;
      text-align: left;
      margin-bottom: 14px;
    }

    .bad-word {
      color: #f59e0b;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 4px;
      border-radius: 4px;
    }

    .status-msg {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 12px;
      min-height: 18px;
    }

    .size-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1b1e28;
      border: 1px solid #242836;
      color: #9ca3af;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 999px;
    }

    /* Profile Footer */
    .footer {
      width: 100%;
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      color: #9ca3af;
    }

    .profile-card {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #12141a;
      border: 1px solid #222634;
      padding: 8px 18px;
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .profile-card:hover {
      border-color: #f59e0b;
      background: #181d29;
      transform: translateY(-2px);
    }

    .avatar-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #f59e0b;
    }

    .profile-name {
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
    }

    .profile-role {
      color: #f59e0b;
      font-size: 11px;
      font-weight: 500;
      margin-left: 2px;
    }

    .hidden-input, .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Navbar Header -->
    <div class="top-bar">
      <div class="logo">CleanContent <span>.ai</span></div>
      <div class="badge">v1.1 Multi-Tool</div>
    </div>

    <!-- Main Title -->
    <h1 class="hero-title">
      <span class="line-1">Smart Audio Suite.</span>
      <span class="line-2">Clean & Cut.</span>
    </h1>

    <!-- Centered Paragraph -->
    <p class="hero-desc">
      Remove awkward pauses with Silence Remover, or sanitize speech & sensitive words with Complete Silence.
    </p>

    <!-- Main Card -->
    <div class="main-card">
      
      <!-- Native file input -->
      <input 
        type="file" 
        id="fileInput" 
        class="hidden-input" 
        accept="*/*" 
      />

      <!-- Dropzone Label -->
      <label for="fileInput" class="upload-zone" id="dropZone">
        <div class="icon-box">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="#0b0c10">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <div class="card-title" id="uploadTitle">Select or drop your audio clip</div>
        <div class="card-subtitle">
          MP3, WAV, M4A, AAC supported. <span class="browse-link">Browse files</span>
        </div>
      </label>

      <!-- Mode Selector -->
      <div class="options-group">
        <button type="button" class="option-btn active" id="btnSilence" onclick="selectTool('silence')">
          ✂️ Silence Remover
        </button>
        <button type="button" class="option-btn" id="btnClean" onclick="selectTool('clean')">
          🔇 Clean Audio
        </button>
      </div>

      <!-- Add Words (Only in Clean Audio mode) -->
      <div id="wordsSection" class="hidden">
        <label class="words-label" for="badWordsInput">Add words to mute (separated by comma):</label>
        <input type="text" id="badWordsInput" class="words-input" placeholder="e.g. damn, shoot, silence" />
      </div>

      <div class="status-msg" id="statusMsg"></div>

      <!-- Process Action Button -->
      <button type="button" class="process-btn" id="processBtn" onclick="startProcessing()">
        ⚡ Process Audio
      </button>

      <!-- Result Audio & Download Box -->
      <div class="result-box hidden" id="resultBox">
        <audio id="audioPlayer" controls></audio>
        <div class="transcript-box hidden" id="transcriptBox"></div>
        <a id="downloadLink" class="download-link" download="cleaned_audio.mp3">Download Processed Audio</a>
      </div>

      <div class="size-badge">
        ⏱️ Max 100 MB
      </div>
    </div>

    <!-- Team Footer: Only Zain Shabir -->
    <footer class="footer">
      <span>Engineered by</span>
      <a href="https://www.linkedin.com/in/zain-shabir-38a345322" target="_blank" rel="noopener noreferrer" class="profile-card">
        <img 
          src="/static/zain.jpg" 
          alt="Zain Shabir" 
          class="avatar-img" 
          onerror="this.src='https://ui-avatars.com/api/?name=Zain+Shabir&background=f59e0b&color=000'" 
        />
        <div>
          <span class="profile-name">Zain Shabir</span>
          <span class="profile-role">(Developer)</span>
        </div>
      </a>
    </footer>
  </div>

  <script>
    let currentMode = 'silence';
    const fileInput = document.getElementById('fileInput');
    const uploadTitle = document.getElementById('uploadTitle');
    const dropZone = document.getElementById('dropZone');
    const statusMsg = document.getElementById('statusMsg');
    const processBtn = document.getElementById('processBtn');
    const resultBox = document.getElementById('resultBox');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');
    const transcriptBox = document.getElementById('transcriptBox');

    function selectTool(mode) {
      currentMode = mode;
      const btnSilence = document.getElementById('btnSilence');
      const btnClean = document.getElementById('btnClean');
      const wordsSection = document.getElementById('wordsSection');

      if (mode === 'silence') {
        btnSilence.classList.add('active');
        btnClean.classList.remove('active');
        wordsSection.classList.add('hidden');
      } else if (mode === 'clean') {
        btnClean.classList.add('active');
        btnSilence.classList.remove('active');
        wordsSection.classList.remove('hidden');
      }
    }

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        uploadTitle.innerText = e.target.files[0].name;
      }
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        uploadTitle.innerText = e.dataTransfer.files[0].name;
      }
    });

    async function startProcessing() {
      if (!fileInput.files || !fileInput.files.length) {
        alert('Please select an audio/video file first!');
        return;
      }

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append("file", file);

      processBtn.disabled = true;
      resultBox.classList.add("hidden");
      transcriptBox.classList.add("hidden");

      let endpoint = "";
      if (currentMode === 'silence') {
        endpoint = "/api/remove-silence";
        statusMsg.innerText = "Trimming silent pauses... please wait";
      } else {
        endpoint = "/api/process";
        formData.append("mode", "silence");
        formData.append("custom_words", document.getElementById("badWordsInput").value);
        statusMsg.innerText = "Transcribing & silencing target words... please wait";
      }

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          throw new Error(await response.text());
        }

        const data = await response.json();
        statusMsg.innerText = "Processing completed in " + data.elapsed_seconds + "s!";
        
        audioPlayer.src = data.audio_url;
        downloadLink.href = data.audio_url;

        if (data.transcript && data.censored_words) {
          transcriptBox.classList.remove("hidden");
          transcriptBox.innerHTML = data.transcript.map(w => {
            const ms = Math.round(w.start * 1000);
            const isBad = data.censored_words.some(cw => Math.abs(cw.start - ms) < 150);
            return isBad ? `<span class="bad-word">[MUTED: ${w.word}]</span>` : w.word;
          }).join(" ");
        }

        resultBox.classList.remove("hidden");
      } catch (err) {
        statusMsg.innerText = "Error: " + err.message;
      } finally {
        processBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
