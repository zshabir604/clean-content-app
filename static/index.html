<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanContent .ai</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d0e12;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header Bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
    }

    .logo span {
      color: #f59e0b;
    }

    .badge {
      border: 1px solid #785210;
      color: #f59e0b;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.05);
    }

    /* Heading Section */
    .hero-title {
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 14px;
    }

    .hero-title .line-1 {
      display: block;
      color: #ffffff;
    }

    .hero-title .line-2 {
      display: block;
      color: #f59e0b;
    }

    .hero-desc {
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      color: #9ca3af;
      max-width: 320px;
      margin: 0 auto 28px;
    }

    /* Main Upload Card */
    .card {
      width: 100%;
      background: #13151b;
      border: 1px solid #1f232e;
      border-radius: 20px;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .icon-box {
      width: 56px;
      height: 56px;
      background: #f59e0b;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.45);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
      text-align: center;
    }

    .card-subtitle {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 20px;
      text-align: center;
    }

    .browse-link {
      color: #f59e0b;
      text-decoration: underline;
      cursor: pointer;
    }

    /* Toggle Option Buttons */
    .options-group {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 16px;
    }

    .option-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #181b22;
      border: 1px solid #282c37;
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn.active {
      background: #20242f;
      border-color: #f59e0b;
      color: #ffffff;
    }

    /* Conditional Add Words Tab */
    #wordsSection {
      width: 100%;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #wordsSection.hidden {
      display: none;
    }

    .words-label {
      font-size: 11px;
      color: #9ca3af;
    }

    .words-input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      background: #0d0e12;
      border: 1px solid #282c37;
      color: #ffffff;
      font-size: 12px;
      outline: none;
    }

    .words-input:focus {
      border-color: #f59e0b;
    }

    /* Info Badge */
    .size-limit {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1c1f28;
      color: #9ca3af;
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 999px;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Header -->
    <div class="top-bar">
      <div class="logo">CleanContent <span>.ai</span></div>
      <div class="badge">v1.1 Multi-Tool</div>
    </div>

    <!-- Main Title -->
    <h1 class="hero-title">
      <span class="line-1">Smart Audio Suite.</span>
      <span class="line-2">Clean & Cut.</span>
    </h1>

    <!-- Centered Paragraph -->
    <p class="hero-desc">
      Remove awkward pauses with Silence Remover, or sanitize speech & sensitive words with Complete Silence.
    </p>

    <!-- Upload Card -->
    <div class="card">
      <div class="icon-box">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#000">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
        </svg>
      </div>

      <div class="card-title">Select or drop your audio clip</div>
      <div class="card-subtitle">
        MP3, WAV, M4A, MP4 supported. 
        <span class="browse-link" onclick="document.getElementById('fileInput').click()">Browse files</span>
      </div>

      <input type="file" id="fileInput" accept="audio/*,video/*" />

      <!-- Mode Selector -->
      <div class="options-group">
        <button type="button" class="option-btn active" id="btnSilence" onclick="selectTool('silence')">
          ✂️ Silence Remover
        </button>
        <button type="button" class="option-btn" id="btnClean" onclick="selectTool('clean')">
          🔇 Clean Audio
        </button>
      </div>

      <!-- Add Words Tab (Only visible in Clean Audio) -->
      <div id="wordsSection" class="hidden">
        <label class="words-label" for="badWordsInput">Add words to mute (comma separated):</label>
        <input type="text" id="badWordsInput" class="words-input" placeholder="e.g. badword, swear, silence" />
      </div>

      <div class="size-limit">
        ⏱️ Max 100 MB
      </div>
    </div>
  </div>

  <script>
    function selectTool(mode) {
      const btnSilence = document.getElementById('btnSilence');
      const btnClean = document.getElementById('btnClean');
      const wordsSection = document.getElementById('wordsSection');

      if (mode === 'silence') {
        // Silence Remover active: hide words input
        btnSilence.classList.add('active');
        btnClean.classList.remove('active');
        wordsSection.classList.add('hidden');
      } else if (mode === 'clean') {
        // Clean Audio active: show words input
        btnClean.classList.add('active');
        btnSilence.classList.remove('active');
        wordsSection.classList.remove('hidden');
      }
    }

    // File selection listener
    document.getElementById('fileInput').addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        document.querySelector('.card-title').innerText = e.target.files[0].name;
      }
    });
  </script>

</body>
</html>
