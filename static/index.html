<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanContent .ai</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0b0c10;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 34px 34px;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 18px 24px;
      overflow-x: hidden;
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: #f59e0b;
    }

    .badge {
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #f59e0b;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.06);
    }

    /* Main Container Card */
    .main-card {
      width: 100%;
      background: #12141a;
      border: 1px solid #222634;
      border-radius: 24px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    /* Upload Zone Drop Label */
    .upload-zone {
      width: 100%;
      background: #151821;
      border: 2px dashed #2f3547;
      border-radius: 18px;
      padding: 36px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
      margin-bottom: 18px;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: #f59e0b;
      background: #181d29;
      transform: translateY(-2px);
    }

    .icon-box {
      width: 82px;
      height: 82px;
      background: #f59e0b;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 0 35px rgba(245, 158, 11, 0.5);
      transition: transform 0.25s ease;
      pointer-events: none;
    }

    .upload-zone:hover .icon-box {
      transform: scale(1.06);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      pointer-events: none;
    }

    .card-subtitle {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      pointer-events: none;
    }

    .browse-link {
      color: #f59e0b;
      text-decoration: underline;
      font-weight: 600;
    }

    /* File Name Box */
    .file-badge-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 10px 16px;
      border-radius: 14px;
      margin-bottom: 18px;
      width: 100%;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .file-badge-box svg {
      color: #f59e0b;
      flex-shrink: 0;
    }

    .file-name-text {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Slide Switch Stage */
    .buttons-track {
      position: relative;
      width: 100%;
      height: 52px;
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      position: absolute;
      top: 0;
      width: calc(50% - 5px);
      height: 52px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      background: #171922;
      border: 1px solid #282d3d;
      color: #9ca3af;
      transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    #btnSilence {
      left: 0;
    }

    #btnClean {
      right: 0;
    }

    /* SLIDE ANIMATION CLASSES */
    /* When Silence is clicked: it slides right over Clean, Clean vanishes */
    .slide-silence-active #btnSilence {
      left: 0;
      width: 100%;
      background: #1f2330;
      border-color: #f59e0b;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
      z-index: 2;
    }
    .slide-silence-active #btnClean {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85);
    }

    /* When Clean is clicked: it slides left over Silence, Silence vanishes */
    .slide-clean-active #btnClean {
      right: 0;
      width: 100%;
      background: #1f2330;
      border-color: #f59e0b;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
      z-index: 2;
    }
    .slide-clean-active #btnSilence {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.85);
    }

    /* Clean Audio Step 2 Options */
    .clean-options-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid #222634;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: slideInDown 0.35s ease forwards;
    }

    .options-label {
      font-size: 11px;
      font-weight: 700;
      color: #9ca3af;
      letter-spacing: 0.05em;
    }

    .censor-modes {
      display: flex;
      gap: 8px;
    }

    .sub-mode-pill {
      flex: 1;
      padding: 10px 4px;
      border-radius: 10px;
      border: 1px solid #282d3d;
      background: #0b0c10;
      color: #9ca3af;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .sub-mode-pill.selected {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.14);
      color: #f59e0b;
    }

    .words-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      background: #0b0c10;
      border: 1px solid #282d3d;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .words-input:focus {
      border-color: #f59e0b;
    }

    /* Process Clean Audio Action Button */
    .process-clean-btn {
      width: 100%;
      background: #f59e0b;
      color: #000000;
      border: none;
      font-size: 15px;
      font-weight: 700;
      padding: 14px;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
      animation: popIn 0.3s ease;
    }

    .process-clean-btn:hover {
      background: #d97706;
    }

    .process-clean-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Equalizer Wave Bars Animation */
    .wave-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 14px 0 16px;
      animation: fadeIn 0.3s ease;
    }

    .wave-bars {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 38px;
    }

    .bar {
      width: 5px;
      height: 8px;
      background: #f59e0b;
      border-radius: 99px;
      animation: waveMove 1s ease-in-out infinite alternate;
    }

    .bar:nth-child(1) { animation-delay: 0.1s; }
    .bar:nth-child(2) { animation-delay: 0.25s; }
    .bar:nth-child(3) { animation-delay: 0.45s; }
    .bar:nth-child(4) { animation-delay: 0.2s; }
    .bar:nth-child(5) { animation-delay: 0.5s; }
    .bar:nth-child(6) { animation-delay: 0.35s; }

    @keyframes waveMove {
      0% { height: 8px; opacity: 0.4; }
      100% { height: 38px; opacity: 1; box-shadow: 0 0 12px rgba(245, 158, 11, 0.7); }
    }

    /* Result Stage Card */
    .result-box {
      width: 100%;
      margin-top: 18px;
      padding-top: 20px;
      border-top: 1px solid #222634;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: slideInDown 0.4s ease forwards;
    }

    audio {
      width: 100%;
      margin-bottom: 16px;
      outline: none;
    }

    .download-btn {
      width: 100%;
      background: #10b981;
      color: #000;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 13px;
      border-radius: 12px;
      text-align: center;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.3);
      margin-bottom: 14px;
    }

    .download-btn:hover {
      background: #059669;
    }

    .clean-prompt-tab {
      width: 100%;
      background: rgba(245, 158, 11, 0.05);
      border: 1.5px dashed rgba(245, 158, 11, 0.35);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .clean-prompt-tab:hover {
      background: rgba(245, 158, 11, 0.1);
      border-color: #f59e0b;
    }

    .transcript-box {
      width: 100%;
      max-height: 130px;
      overflow-y: auto;
      background: #0b0c10;
      border: 1px solid #242836;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #d1d5db;
      text-align: left;
      margin-bottom: 14px;
    }

    .bad-word {
      color: #f59e0b;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.15);
      padding: 2px 4px;
      border-radius: 4px;
    }

    .status-msg {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 10px;
      text-align: center;
      min-height: 18px;
    }

    .size-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1b1e28;
      border: 1px solid #242836;
      color: #9ca3af;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-top: 18px;
    }

    /* Footer */
    .footer {
      width: 100%;
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #9ca3af;
    }

    .profile-card {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #12141a;
      border: 1px solid #222634;
      padding: 8px 18px;
      border-radius: 999px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .profile-card:hover {
      border-color: #f59e0b;
      background: #181d29;
      transform: translateY(-2px);
    }

    .avatar-img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #f59e0b;
    }

    .profile-name {
      color: #ffffff;
      font-weight: 600;
      font-size: 13px;
    }

    .profile-role {
      color: #f59e0b;
      font-size: 11px;
      font-weight: 500;
      margin-left: 2px;
    }

    @keyframes slideInDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Navbar -->
    <div class="top-bar">
      <div class="logo">CleanContent <span>.ai</span></div>
      <div class="badge">v1.1 Multi-Tool</div>
    </div>

    <!-- Main App Card -->
    <div class="main-card">
      
      <input type="file" id="fileInput" class="hidden" accept="*/*" />

      <!-- Drag & Drop Label -->
      <label for="fileInput" class="upload-zone" id="dropZone">
        <div class="icon-box">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="#0b0c10">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
        </div>
        <div class="card-title">Select or drop your audio clip</div>
        <div class="card-subtitle">
          MP3, WAV, M4A, AAC supported. <span class="browse-link">Browse files</span>
        </div>
      </label>

      <!-- File Name Pill Display -->
      <div class="file-badge-box hidden" id="fileBadgeBox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span class="file-name-text" id="fileNameDisplay">Audio selected</span>
      </div>

      <!-- Sliding Dual Action Buttons -->
      <div class="buttons-track" id="buttonsTrack">
        <button type="button" class="tab-btn" id="btnSilence" onclick="triggerSilenceRemover()">
          ✂️ Silence Remover
        </button>
        <button type="button" class="tab-btn" id="btnClean" onclick="triggerCleanAudio()">
          🔇 Clean Audio
        </button>
      </div>

      <!-- Clean Audio Configuration (Only shown in Clean Audio mode) -->
      <div id="cleanConfigSection" class="clean-options-container hidden">
        <div>
          <div class="options-label" style="margin-bottom: 8px;">CENSORSHIP METHOD:</div>
          <div class="censor-modes">
            <button type="button" class="sub-mode-pill selected" data-censor="silence" onclick="setCensorMode('silence')">
              🔇 Mute Silence
            </button>
            <button type="button" class="sub-mode-pill" data-censor="beep" onclick="setCensorMode('beep')">
              🔊 Beep Tone
            </button>
            <button type="button" class="sub-mode-pill" data-censor="remove" onclick="setCensorMode('remove')">
              ✂️ Cut Word
            </button>
          </div>
        </div>

        <div>
          <div class="options-label" style="margin-bottom: 6px;">ADD CUSTOM WORDS TO MUTE (OPTIONAL):</div>
          <input type="text" id="badWordsInput" class="words-input" placeholder="e.g. damn, shoot, bakwas (comma-separated)" />
        </div>

        <button type="button" class="process-clean-btn" id="processCleanBtn" onclick="runCleanAudioProcessing()">
          ⚡ Process Clean Audio
        </button>
      </div>

      <!-- Processing Dynamic Equalizer Bars Animation -->
      <div class="wave-wrapper hidden" id="waveAnimation">
        <div class="wave-bars">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
        <span style="font-size: 12px; color: #f59e0b; font-weight: 600;" id="waveStatusText">Processing Audio...</span>
      </div>

      <div class="status-msg" id="statusMsg"></div>

      <!-- Result Stage Card (Player -> Download -> Clean Prompt) -->
      <div class="result-box hidden" id="resultBox">
        <audio id="audioPlayer" controls></audio>
        
        <div class="transcript-box hidden" id="transcriptBox"></div>

        <a id="downloadBtn" class="download-btn" download="cleaned_audio.mp3">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download Processed Audio
        </a>

        <!-- Clean words prompt for silence-trimmed audio -->
        <div class="clean-prompt-tab hidden" id="followUpCleanTab" onclick="triggerCleanAudioAfterSilence()">
          <div style="font-size: 13px; font-weight: 700; color: #f59e0b;">🔇 Want to censor words in this trimmed audio?</div>
          <div style="font-size: 11px; color: #9ca3af; margin-top: 3px;">Click to apply Beep / Mute / Cut on this file</div>
        </div>
      </div>

      <div class="size-badge">
        ⏱️ Max 100 MB
      </div>
    </div>

    <!-- Developer Footer -->
    <footer class="footer">
      <span>Engineered by</span>
      <a href="https://www.linkedin.com/in/zain-shabir-38a345322" target="_blank" rel="noopener noreferrer" class="profile-card">
        <img 
          src="/static/zain.jpg" 
          alt="Zain Shabir" 
          class="avatar-img" 
          onerror="this.src='https://ui-avatars.com/api/?name=Zain+Shabir&background=f59e0b&color=000'" 
        />
        <div>
          <span class="profile-name">Zain Shabir</span>
          <span class="profile-role">(Developer)</span>
        </div>
      </a>
    </footer>
  </div>

  <script>
    let chosenCensorMode = 'silence';
    let currentJobId = null;

    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const fileBadgeBox = document.getElementById('fileBadgeBox');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const buttonsTrack = document.getElementById('buttonsTrack');
    const btnSilence = document.getElementById('btnSilence');
    const btnClean = document.getElementById('btnClean');
    const cleanConfigSection = document.getElementById('cleanConfigSection');
    const waveAnimation = document.getElementById('waveAnimation');
    const waveStatusText = document.getElementById('waveStatusText');
    const statusMsg = document.getElementById('statusMsg');
    const resultBox = document.getElementById('resultBox');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadBtn = document.getElementById('downloadBtn');
    const transcriptBox = document.getElementById('transcriptBox');
    const followUpCleanTab = document.getElementById('followUpCleanTab');
    const processCleanBtn = document.getElementById('processCleanBtn');

    function handleFile(file) {
      currentJobId = null;
      fileNameDisplay.textContent = file.name;
      fileBadgeBox.classList.remove('hidden');
      resultBox.classList.add('hidden');
      cleanConfigSection.classList.add('hidden');
      buttonsTrack.className = "buttons-track"; // reset slide track
      statusMsg.innerText = "";
    }

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) handleFile(e.target.files[0]);
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        fileInput.files = e.dataTransfer.files;
        handleFile(e.dataTransfer.files[0]);
      }
    });

    // 1. Click Silence Remover: Slides over Clean Audio and starts immediately
    function triggerSilenceRemover() {
      if (!currentJobId && (!fileInput.files || !fileInput.files.length)) {
        alert('Please select an audio/video file first!');
        return;
      }

      buttonsTrack.className = "buttons-track slide-silence-active";
      cleanConfigSection.classList.add('hidden');

      // Direct silence processing without extra process button
      executeBackendRequest('/api/remove-silence', null, "Trimming silent dead-air pauses...");
    }

    // 2. Click Clean Audio: Slides over Silence Remover and reveals Clean options + Process Button
    function triggerCleanAudio() {
      if (!currentJobId && (!fileInput.files || !fileInput.files.length)) {
        alert('Please select an audio/video file first!');
        return;
      }

      buttonsTrack.className = "buttons-track slide-clean-active";
      cleanConfigSection.classList.remove('hidden');
      resultBox.classList.add('hidden');
    }

    function setCensorMode(mode) {
      chosenCensorMode = mode;
      document.querySelectorAll('.sub-mode-pill').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.censor === mode);
      });
    }

    // 3. Process button inside Clean Audio mode
    function runCleanAudioProcessing() {
      const extraFormData = {
        mode: chosenCensorMode,
        custom_words: document.getElementById('badWordsInput').value
      };
      executeBackendRequest('/api/process', extraFormData, "Transcribing & censoring target words...");
    }

    function triggerCleanAudioAfterSilence() {
      triggerCleanAudio();
      cleanConfigSection.scrollIntoView({ behavior: 'smooth' });
    }

    async function executeBackendRequest(endpoint, extraData, loadingText) {
      const formData = new FormData();
      if (currentJobId) {
        formData.append("job_id_existing", currentJobId);
      } else {
        formData.append("file", fileInput.files[0]);
      }

      if (extraData) {
        formData.append("mode", extraData.mode);
        formData.append("custom_words", extraData.custom_words);
      }

      waveStatusText.innerText = loadingText;
      waveAnimation.classList.remove('hidden');
      resultBox.classList.add('hidden');
      transcriptBox.classList.add('hidden');
      statusMsg.innerText = "";
      btnSilence.disabled = true;
      btnClean.disabled = true;
      processCleanBtn.disabled = true;

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          body: formData
        });

        if (!response.ok) throw new Error(await response.text());

        const data = await response.json();
        currentJobId = data.job_id;

        audioPlayer.src = data.audio_url;
        downloadBtn.href = data.audio_url;

        // Transcript handling
        if (data.transcript && data.censored_words) {
          transcriptBox.classList.remove('hidden');
          transcriptBox.innerHTML = data.transcript.map(w => {
            const ms = Math.round(w.start * 1000);
            const isBad = data.censored_words.some(cw => Math.abs(cw.start - ms) < 150);
            return isBad ? `<span class="bad-word">[${chosenCensorMode.toUpperCase()}: ${w.word}]</span>` : w.word;
          }).join(" ");
          followUpCleanTab.classList.add('hidden');
        } else {
          // If silence remover was triggered, show prompt to clean words
          followUpCleanTab.classList.remove('hidden');
        }

        statusMsg.innerText = `Done in ${data.elapsed_seconds}s!`;
        resultBox.classList.remove('hidden');
      } catch (err) {
        statusMsg.innerText = "Error: " + err.message;
      } finally {
        waveAnimation.classList.add('hidden');
        btnSilence.disabled = false;
        btnClean.disabled = false;
        processCleanBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
